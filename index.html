<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f5f2" />
    <meta name="description" content="Et lille Hangman-spil bygget med HTML, CSS og JavaScript." />
    <title>Hangman | Projekt A</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="site-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">H</span>
          <span>HANGMAN</span>
        </div>
        <span class="project-label">Projekt A / Opgave 11</span>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">Hang<span>man.</span></h1>
          <p class="intro">Brug ledetråden. Vælg bogstaver. Red figuren før den sjette fejl.</p>
        </div>
        <button id="new-game" class="new-game" type="button">Nyt ord</button>
      </section>

      <section class="game" aria-label="Hangman-spil">
        <div class="drawing-panel">
          <div class="panel-heading">
            <span>Figuren</span>
            <span id="tries-label">6 forsøg tilbage</span>
          </div>

          <div class="drawing-wrap">
            <svg class="drawing" viewBox="0 0 240 260" role="img" aria-label="Figuren tegnes efter seks forkerte gæt">
              <g class="scaffold" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
                <path d="M27 239h159M57 239V24h104v30" />
              </g>
              <g class="figure" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
                <circle class="figure-part" cx="161" cy="77" r="23" />
                <path class="figure-part" d="M161 100v68" />
                <path class="figure-part" d="M161 120l-34 28" />
                <path class="figure-part" d="M161 120l34 28" />
                <path class="figure-part" d="M161 168l-28 40" />
                <path class="figure-part" d="M161 168l28 40" />
              </g>
            </svg>
          </div>

          <div class="score-row">
            <span>Forkerte gæt</span>
            <strong><span id="mistakes">0</span><small> / 6</small></strong>
          </div>
          <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
          <p class="wrong-heading">Forkerte bogstaver</p>
          <p id="wrong-letters" class="wrong-letters">Ingen endnu</p>
        </div>

        <div class="play-panel">
          <div class="panel-heading">
            <span>Dit ord</span>
            <span id="word-length">0 bogstaver</span>
          </div>

          <div class="clue">
            <span class="eyebrow">Ledetråd</span>
            <p id="hint" class="hint"></p>
          </div>

          <div id="word" class="word" role="group" aria-label="Det skjulte ord"></div>
          <p id="message" class="message" role="status" aria-live="polite"></p>

          <h2>Vælg et bogstav</h2>
          <div id="keyboard" class="keyboard" role="group" aria-label="Bogstaver"></div>
        </div>
      </section>

    </main>
  </body>
</html>
